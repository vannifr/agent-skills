when:
  - event: push
    branch: main

steps:
  - name: install
    image: node:22-slim@sha256:3f1d5c0e8a7b4c6d9e2f1a0b3c5d7e9f1a2b4c6d8e0f1a3b5c7d9e1f2a4b6c8d
    commands:
      - corepack enable
      - pnpm install --frozen-lockfile

  - name: lint
    image: node:22-slim@sha256:3f1d5c0e8a7b4c6d9e2f1a0b3c5d7e9f1a2b4c6d8e0f1a3b5c7d9e1f2a4b6c8d
    commands:
      - corepack enable
      - pnpm lint:docs
      - pnpm lint:tracked

  - name: test
    image: node:22-slim@sha256:3f1d5c0e8a7b4c6d9e2f1a0b3c5d7e9f1a2b4c6d8e0f1a3b5c7d9e1f2a4b6c8d
    commands:
      - corepack enable
      - pnpm test:coverage

  - name: sonarqube
    image: sonarsource/sonar-scanner-cli@sha256:9a8b7c6d5e4f3a2b1c0d9e8f7a6b5c4d3e2f1a0b9c8d7e6f5a4b3c2d1e0f9a8b
    environment:
      SONAR_TOKEN:
        from_secret: sonar_token
    commands:
      - sonar-scanner -Dsonar.host.url=$SONAR_HOST_URL
