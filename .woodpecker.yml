# Woodpecker CI pipeline for agent-skills
# Vervangt .github/workflows/skill-quality-gate.yml

when:
  - event: [push, pull_request, manual]

clone:
  git:
    image: woodpeckerci/plugin-git@sha256:550075c844fcec0af41d9d28f9860aa5d8c43e1e9419be4b9266dc02c2f29804
    settings:
      depth: 0
      partial: false

steps:
  - name: gitleaks
    image: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
    commands:
      - sh scripts/secret-scan.sh selftest
      - sh scripts/secret-scan.sh

  - name: shellcheck
    image: koalaman/shellcheck-alpine:v0.11.0@sha256:9955be09ea7f0dbf7ae942ac1f2094355bb30d96fffba0ec09f5432207544002
    commands:
      - apk add --no-cache git
      - git ls-files -z '*.sh' '.githooks/*' ':!:skills/*/evals/*' | xargs -0 shellcheck -S style

  - name: structure-tests
    image: node:22-alpine@sha256:0a7108bf6c7bf5de370ffb1a3ed6be93d405b43ff159f681a8d18c0e2bc2e402
    commands:
      # site-revision script tests spawn python3 and its http.server.
      - apk add --no-cache python3
      - node --test scripts/*.test.mjs

  - name: structure-lint
    image: node:22-alpine@sha256:0a7108bf6c7bf5de370ffb1a3ed6be93d405b43ff159f681a8d18c0e2bc2e402
    commands:
      - node scripts/structure-lint.mjs

  - name: tessl-review
    image: node:22-alpine@sha256:0a7108bf6c7bf5de370ffb1a3ed6be93d405b43ff159f681a8d18c0e2bc2e402
    commands:
      # node:22-alpine has no git; without it the diff below fails and the
      # review never ran.
      - apk add --no-cache git
      - git fetch --depth=2 origin 2>/dev/null || true
      - npm install -g @tessl/cli@0.109.0
      - |
        BEFORE_SHA=$(git rev-parse HEAD~1 2>/dev/null || echo "")
        HEAD_SHA=$(git rev-parse HEAD)
        if [ -n "${REVIEW_SKILLS:-}" ]; then
          CHANGED="$REVIEW_SKILLS"
        elif [ -z "$BEFORE_SHA" ]; then
          echo "First commit — reviewing all skill directories."
          CHANGED=$(find skills -mindepth 1 -maxdepth 1 -type d)
        else
          CHANGED=$(git diff --name-only "$BEFORE_SHA..$HEAD_SHA" -- skills/ | sed -E 's#^(skills/[^/]+)/.*#\1#' | sort -u)
        fi
        if [ -z "$CHANGED" ]; then
          echo "No skill directories changed — nothing to review."
          exit 0
        fi
        fail=0
        for d in $CHANGED; do
          [ -d "$d" ] || continue
          echo "== $d =="
          tessl review run quality --workspace vannifr --threshold 80 "$d" || fail=1
        done
        exit $fail
    environment:
      TESSL_TOKEN:
        from_secret: tessl_token
    depends_on: [structure-tests, structure-lint]
    # Tessl credits are limited: the review runs only on a manual pipeline
    # (Woodpecker UI "Run pipeline", optionally with variable
    # REVIEW_SKILLS="skills/<name> skills/<other>"), never on push.
    when:
      - event: manual
    failure: ignore
