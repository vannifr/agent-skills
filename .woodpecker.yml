# Woodpecker CI pipeline for agent-skills
# Vervangt .github/workflows/skill-quality-gate.yml

when:
  - event: [push, pull_request]

steps:
  - name: gitleaks
    image: ghcr.io/gitleaks/gitleaks:v8.30.1
    commands:
      - git fetch --unshallow 2>/dev/null || git fetch --depth=100 2>/dev/null || true
      - gitleaks detect --verbose --redact

  - name: structure-tests
    image: node:22-alpine
    commands:
      - node --test scripts/*.test.mjs

  - name: structure-lint
    image: node:22-alpine
    commands:
      - node scripts/structure-lint.mjs

  - name: tessl-review
    image: node:22-alpine
    commands:
      - npm install -g @tessl/cli@0.109.0
      - |
        BEFORE_SHA=$(git rev-parse HEAD~1 2>/dev/null || echo "")
        HEAD_SHA=$(git rev-parse HEAD)
        if [ -z "$BEFORE_SHA" ]; then
          echo "First commit — reviewing all skill directories."
          CHANGED=$(find skills -mindepth 1 -maxdepth 1 -type d)
        else
          CHANGED=$(git diff --name-only "$BEFORE_SHA..$HEAD_SHA" -- skills/ | sed -E 's#^(skills/[^/]+)/.*#\1#' | sort -u)
        fi
        if [ -z "$CHANGED" ]; then
          echo "No skill directories changed — nothing to review."
          exit 0
        fi
        fail=0
        for d in $CHANGED; do
          [ -d "$d" ] || continue
          echo "== $d =="
          tessl review run quality --workspace vannifr --threshold 80 "$d" || fail=1
        done
        exit $fail
    environment:
      TESSL_TOKEN:
        from_secret: tessl_token
    depends_on: [structure-tests, structure-lint]
    failure: ignore
